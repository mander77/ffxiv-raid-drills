<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Healer practice drills for M11S (The Tyrant, Savage) in Final Fantasy XIV: positions, raise decisions, cooldowns and a timed pressure round.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231B7448'/%3E%3Cpath d='M13 6h6v7h7v6h-7v7h-6v-7H6v-6h7z' fill='%23fff'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>M11S Healer Drills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a sticky top bar (name, H1/H2 switch, session score, tabs), then one drill stage per tab.
   Map drills put the arena on the left and the question on the right; they stack on phones.
   Light theme only, by request. */
:root{
  --paper:#EEF1F4;
  --card:#FFFFFF;
  --ink:#131A2B;
  --ink-2:#465166;
  --line:#D5DBE4;
  --heal:#1B7448;
  --heal-soft:#E2F1E8;
  --heal-ink:#0F4D2F;
  --miss:#A8261D;
  --miss-soft:#FBE8E6;
  --warn:#8A5200;
  --warn-soft:#FFF0D4;
  --sand:#E7D5AE;
  --sand-line:#D3BC8C;
  --void:#2A2E35;
  --aoe:#E9781C;
  --aoe-fill:rgba(233,120,28,.30);
  --line-aoe:#4F95CF;
  --boss:#5B1A12;
  --ring:#C2362B;
  --wm-red:#D2413B;
  --wm-yellow:#E0B21E;
  --wm-blue:#2E76B8;
  --wm-purple:#8350BE;
  --tank:#2D58B0;
  --dps:#9C3535;
  --rock:#8C8F96;
  --tornado:#5E7489;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
:focus-visible{outline:3px solid var(--wm-blue);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--card);border-bottom:1px solid var(--line)}
.topin{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:12px 4px}
.brand{flex:1 1 300px;min-width:0}
.brand h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:32px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.brand h1 span{color:var(--heal)}
.brand p{margin:5px 0 0;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-2);letter-spacing:.02em}
.slot{display:flex;align-items:center;gap:8px}
.slot .lbl{font-size:14px;color:var(--ink-2)}
.seg{display:inline-flex;border:1.5px solid var(--heal);border-radius:8px;overflow:hidden}
.seg button{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:.05em;padding:3px 15px;border:0;background:var(--card);color:var(--heal);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--heal);color:#fff}
.seg.small button{font-family:var(--font-body);font-weight:700;font-size:14px;letter-spacing:0;padding:5px 12px}
.score{font-family:var(--font-mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;padding:6px 10px;border:1px solid var(--line);border-radius:8px;white-space:nowrap}
@media (max-width:640px){header.top{position:static}.brand h1{font-size:28px}}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;font:inherit;font-size:15px;padding:10px 13px 9px;border:0;border-bottom:3px solid transparent;background:none;color:var(--ink-2);cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--heal);font-weight:700}

main{padding-block:20px 56px}
.tabhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;margin-bottom:16px}
.lede{margin:0;max-width:68ch;color:var(--ink-2);min-width:0;flex:1 1 360px}
.ctrl{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}

.stage{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr)}}
.arena{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.arena svg{display:block;width:100%;max-width:600px;height:auto;margin:0 auto;aspect-ratio:108/110;cursor:crosshair;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.arena svg.locked{cursor:default}
.arena .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);margin:8px 4px 2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 20px 22px;min-width:0}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 12px}
.eyebrow b{color:var(--heal);font-weight:500}
.panel h2{font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.05;letter-spacing:.01em;margin:6px 0 10px;text-wrap:balance}
.setup{margin:0 0 14px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps li{border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px}
.steps li.now{border-color:var(--ink);font-weight:700}
.steps li.ok{border-color:var(--heal);background:var(--heal-soft)}
.steps li.bad{border-color:var(--miss);background:var(--miss-soft)}
.steps li .ans{display:block;font-weight:400;margin-top:3px}
.steps li .tag{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.steps li.ok .tag{color:var(--heal-ink)} .steps li.bad .tag{color:var(--miss)}

.qwrap{max-width:780px;margin:0 auto}
.opts{display:grid;gap:10px;margin:14px 0 0}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);font:inherit;color:var(--ink);cursor:pointer;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--heal)}
.opt:disabled{cursor:default}
.opt .key{flex:0 0 auto;font-family:var(--font-mono);font-size:12px;line-height:1;border:1px solid var(--line);border-radius:4px;padding:4px 6px;color:var(--ink-2);margin-top:2px}
.opt.ok{border-color:var(--heal);background:var(--heal-soft)}
.opt.bad{border-color:var(--miss);background:var(--miss-soft)}
.opt.dim{opacity:.55}

.fb{margin-top:16px;border-radius:8px;padding:14px 16px;border:1.5px solid}
.fb.ok{background:var(--heal-soft);border-color:var(--heal)}
.fb.bad{background:var(--miss-soft);border-color:var(--miss)}
.fb.slow{background:var(--warn-soft);border-color:var(--warn)}
.fb h3{margin:0 0 4px;font-family:var(--font-display);font-size:22px;letter-spacing:.02em;text-transform:uppercase}
.fb.ok h3{color:var(--heal-ink)} .fb.bad h3{color:var(--miss)} .fb.slow h3{color:var(--warn)}
.fb p{margin:6px 0 0}
.rule{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--paper);display:grid;gap:2px}
.rule span{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.rule strong{font-size:16px}
.src{margin-top:8px;font-size:13px;color:var(--ink-2)}

.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.btn{font:inherit;font-weight:700;font-size:15px;padding:10px 18px;border-radius:8px;border:1.5px solid var(--heal);background:var(--heal);color:#fff;cursor:pointer}
.btn:hover{background:var(--heal-ink);border-color:var(--heal-ink)}
.btn.ghost{background:var(--card);color:var(--heal)}
.btn.ghost:hover{background:var(--heal-soft)}
.hint{font-size:13px;color:var(--ink-2)}
.hint kbd{font-family:var(--font-mono);font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:var(--card)}

.progress{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.timer{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 14px}
.timer i{display:block;height:100%;width:100%;background:var(--heal)}
.timer.low i{background:var(--warn)}

.big{font-family:var(--font-display);font-weight:700;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.tally{display:flex;flex-wrap:wrap;gap:14px;margin:14px 0}
.tally div{flex:1 1 120px;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.tally span{display:block;font-size:13px;color:var(--ink-2)}
.tally .ok .big{color:var(--heal)} .tally .bad .big{color:var(--miss)} .tally .slow .big{color:var(--warn)}

.sheet{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.sheet section{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.sheet h2{font-family:var(--font-display);font-size:26px;letter-spacing:.02em;text-transform:uppercase;margin:0 0 10px}
.sheet ol{margin:0;padding-left:22px;display:grid;gap:8px;max-width:72ch}
.sheet p{max-width:72ch}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:14.5px}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
td.t{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.n{font-weight:700;min-width:170px}
.chip{display:inline-block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;margin-top:4px;white-space:nowrap}
.k-raidwide{background:var(--warn-soft);color:var(--warn)}
.k-buster{background:#E4EBF8;color:var(--tank)}
.k-heal{background:var(--heal-soft);color:var(--heal-ink)}
.k-mech{background:var(--paper);color:var(--ink-2)}
.k-enrage{background:var(--miss-soft);color:var(--miss)}
.sheet ul.rules{margin:0;padding-left:20px;display:grid;gap:10px;max-width:72ch}
.mini{margin:0;min-width:0}
.mini svg{display:block;width:100%;max-width:340px;height:auto;margin:0 auto}
.mini figcaption{font-size:13px;color:var(--ink-2);margin:6px auto 0;max-width:340px}
.zone.other{fill:rgba(70,81,102,.10);stroke:var(--ink-2)}
.zlabel.other rect{fill:var(--ink-2)}
.ghost{fill:none;stroke:var(--boss);stroke-width:.5;stroke-dasharray:1 1}
.jump{stroke:var(--ring);stroke-width:.7;stroke-dasharray:1.6 1.2}
.links{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.links a{color:var(--wm-blue)}
.links span{color:var(--ink-2);font-size:14px}

/* SVG arena */
.floor{fill:var(--sand)}
.tileline{fill:none;stroke:var(--sand-line);stroke-width:.35}
.edge{fill:none;stroke:#B49C6C;stroke-width:.6}
.voidr{fill:var(--void)}
.aoe{fill:var(--aoe-fill);stroke:var(--aoe);stroke-width:.4}
.lineaoe{stroke:var(--line-aoe);stroke-linecap:butt;opacity:.95}
.ring{fill:none;stroke:var(--ring);stroke-width:1.1}
.bosscore{fill:var(--boss)}
.face{fill:var(--ring)}
.wm text{font-family:var(--font-display);font-weight:700;font-size:4.2px;text-anchor:middle;dominant-baseline:central}
.wm-red circle,.wm-red rect{fill:var(--wm-red)} .wm-red text{fill:#fff}
.wm-yellow circle,.wm-yellow rect{fill:var(--wm-yellow)} .wm-yellow text{fill:var(--ink)}
.wm-blue circle,.wm-blue rect{fill:var(--wm-blue)} .wm-blue text{fill:#fff}
.wm-purple circle,.wm-purple rect{fill:var(--wm-purple)} .wm-purple text{fill:#fff}
.wm circle,.wm rect{opacity:.88}
.compass{font-family:var(--font-mono);font-size:3px;fill:var(--ink-2);text-anchor:middle}
.tag rect{fill:var(--ink)} .tag text{fill:#fff;font-family:var(--font-mono);font-size:2.6px;text-anchor:middle;dominant-baseline:central;letter-spacing:.1px}
.mk rect{stroke:#fff;stroke-width:.35} .mk text{fill:#fff;font-family:var(--font-mono);font-size:2.3px;text-anchor:middle;dominant-baseline:central}
.mk.T rect{fill:var(--tank)} .mk.D rect{fill:var(--dps)} .mk.H rect{fill:var(--heal)}
.tornado path{fill:none;stroke:var(--tornado);stroke-width:.9;stroke-linecap:round}
.tornado circle{fill:rgba(94,116,137,.18)}
.rock{fill:var(--rock);stroke:#5F636B;stroke-width:.4}
.tower circle.out{fill:rgba(255,255,255,.35);stroke:var(--ink);stroke-width:.45;stroke-dasharray:1.2 .9}
.tower circle.in{fill:var(--ink);opacity:.55}
.target{fill:none;stroke:var(--aoe);stroke-width:.7}
.puddle{fill:rgba(194,54,43,.38);stroke:var(--ring);stroke-width:.3}
.zone{stroke-width:.7;stroke-dasharray:1.6 1}
.zone.ok{fill:rgba(27,116,72,.22);stroke:var(--heal)}
.zone.bad{fill:rgba(27,116,72,.16);stroke:var(--heal)}
.zlabel rect{fill:var(--heal)} .zlabel text{fill:#fff;font-family:var(--font-display);font-weight:700;font-size:3.2px;text-anchor:middle;dominant-baseline:central}
.pick .dot{fill:var(--ink)} .pick .halo{fill:none;stroke:var(--ink);stroke-width:.55}
.pick.bad .dot{fill:var(--miss)} .pick.bad .halo{stroke:var(--miss)}
.drop{fill:var(--aoe-fill);stroke:var(--aoe);stroke-width:.35}
.aoeband{stroke:var(--aoe);opacity:.4}
.scy path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.scy .halo{stroke:#fff;stroke-width:3;opacity:.9}
.scy .ink{stroke:var(--boss);stroke-width:1.4}
.scy .butt{fill:var(--boss);stroke:#fff;stroke-width:.5}
.lanesoft{fill:rgba(233,120,28,.14)}
.guide{stroke:#fff;stroke-width:.6;stroke-dasharray:1.6 1.2;opacity:.9}
.portal ellipse{fill:#fff;stroke:var(--ink-2);stroke-width:.35}
.portal text{fill:var(--ink);font-family:var(--font-mono);font-size:3px;text-anchor:middle;dominant-baseline:central}
.zone.hit{fill:rgba(194,54,43,.22);stroke:var(--ring);stroke-dasharray:none;stroke-width:.3}

@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="topin">
      <div class="brand">
        <h1>M11S <span>Healer</span> Drills</h1>
        <p>The Tyrant (Savage) &middot; Hector/Toxic &middot; Kindred No Buddies split &middot; Fixed (3CJ) Ecliptic</p>
      </div>
      <div class="slot">
        <span class="lbl" id="slot-lbl">I am</span>
        <div class="seg" role="group" aria-labelledby="slot-lbl">
          <button type="button" id="slot-H1" data-slot="H1" aria-pressed="true">H1</button>
          <button type="button" id="slot-H2" data-slot="H2" aria-pressed="false">H2</button>
        </div>
      </div>
      <div class="score" id="score" aria-live="polite">This session: 0 / 0</div>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Drill types"></nav>
  </div>
</header>

<main class="wrap" id="view" tabindex="-1"></main>

<script>
(function(){
"use strict";

/* ---------- storage (per-viewer conveniences only) ---------- */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem("m11s." + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("m11s." + k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem("m11s." + k); }catch(e){} }
};
const S = (s, a, b) => s === "H1" ? a : b;
function shuffle(a){ for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(t){ return String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }

const P1 = "Phase 1: Trophy Weapons", P2 = "Phase 2: Meteorain", P3 = "Phase 3: Arena Split", P4 = "Phase 4: Ecliptic Stampede";
const ANDREW = "Andrew's rule";

/* ---------- timeline (cactbot r11s timeline, rounded to the second) ---------- */
const TL = [
  {t:"0:11", n:"Crown of Arcadia", k:"raidwide", job:s=>"Physical raidwide. Mitigate it, then heal up."},
  {t:"0:18", n:"Raw Steel Trophy (axe or scythe)", k:"buster", job:s=>"Hits land at 0:24 to 0:25. Axe: tanks stack, you spread " + S(s,"SSW","SSE") + " far out. Scythe: tanks spread, party stacks south."},
  {t:"0:38", n:"Trophy Weapons, then Assault Evolved", k:"mech", job:s=>"Weapon hits at 0:50, 0:55 and 1:00. The weapon he faces goes first, then clockwise. Every hit adds a vulnerability, so keep healing."},
  {t:"1:13", n:"Trophy Weapons and Void Stardust", k:"mech", job:s=>"Bait 3 puddles from north, each just outside the last, clockwise. Then a spread (Comet) or a stack on a healer (Crushing Comet) at 1:30."},
  {t:"1:33", n:"Assault Evolved (second set)", k:"mech", job:s=>"Weapon hits at 1:35, 1:40 and 1:45."},
  {t:"1:50", n:"Void Stardust (second time)", k:"mech", job:s=>"Puddles again. The spread or stack at 1:56 is the opposite of the first one."},
  {t:"2:02", n:"Crown of Arcadia", k:"raidwide", job:s=>"Raidwide. Heal up fast, Dance of Domination is next."},
  {t:"2:15", n:"Dance of Domination Trophy", k:"raidwide", job:s=>"Seven raidwide hits from 2:21 to 2:26, the last one is the biggest. Pair stacks at 2:31: you go relative " + S(s,"SW with R1","SE with R2") + "."},
  {t:"2:36", n:"Raw Steel Trophy (the other weapon)", k:"buster", job:s=>"The opposite of the first one. Mitigate it. You do not need to heal after it, because Charybdistopia sets HP to 1."},
  {t:"2:59", n:"Charybdistopia", k:"heal", job:s=>"Every player goes to 1 HP. Heal the whole party right away, yourself too."},
  {t:"3:05", n:"Ultimate Trophy Weapons", k:"mech", job:s=>"Six weapons from 3:14 to 3:40. Use strong heals here. A dead player must be up by the 3rd weapon."},
  {t:"3:46", n:"Powerful Gust (tornadoes)", k:"mech", job:s=>"Bait your tornado: " + S(s,"west tornado, north side","east tornado, south side") + "."},
  {t:"4:00", n:"One and Only", k:"raidwide", job:s=>"Heavy physical raidwide. Stack mitigation on it."},
  {t:"4:13", n:"Great Wall of Fire", k:"buster", job:s=>"Two shared tank busters. Shield and heal the tanks. Stay out of the fire line it leaves."},
  {t:"4:26", n:"Orbital Omen and Fire and Fury", k:"mech", job:s=>"The boss faces north. Hector's dodge: stay against his hitbox at his side, and cross it to the middle square the next lines miss."},
  {t:"4:52", n:"Meteorain", k:"mech", job:s=>"Line stacks at 5:00, 5:10, 5:20 and 5:30. Healers bait the 2nd meteors: " + S(s,"drop yours NW, inside the boss hitbox","drop yours SW, in line with the first, farther out") + "."},
  {t:"5:43", n:"Triple Tyrannhilation", k:"raidwide", job:s=>"Three hits. Hide SW behind the three rocks."},
  {t:"6:02", n:"Flatliner", k:"raidwide", job:s=>"Physical raidwide that splits the arena. Mitigate it. Go " + S(s,"west (G1), north end","east (G2), south end") + "."},

function record(id, ok){
  const st = state.stats[id] || {s:0, r:0};
  st.s++; if(ok) st.r++;
  state.stats[id] = st; LS.set("stats", state.stats);
  state.session.total++; if(ok) state.session.right++;
  const pct = Math.round(100 * state.session.right / state.session.total);
  document.getElementById("score").textContent = "This session: " + state.session.right + " / " + state.session.total + " (" + pct + "%)";
}
function weight(id){ const st = state.stats[id]; if(!st) return 3; return Math.max(0.3, 1 + 3 * (st.s - st.r) - 0.25 * Math.min(st.r, 3)); }
function weighted(list){
  const pool = list.slice(), out = [];
  while(pool.length){
    const ws = pool.map(x => weight(x.id));
    let t = ws.reduce((a, b) => a + b, 0) * Math.random(), idx = 0;
    for(; idx < ws.length - 1; idx++){ t -= ws[idx]; if(t <= 0) break; }
    out.push(pool.splice(idx, 1)[0]);
  }
  return out;
}
function getDeck(cat){
  let d = state.decks[cat];
  if(!d){
    const src = POOLS[cat]();
    const items = state.order === "fight" ? src.slice().sort((a, b) => a.order - b.order) : weighted(src);
    d = state.decks[cat] = {items, i:0, right:0, done:0};
  }
  return d;
}

/* ---------- geometry ---------- */
function rot(p, k){ let x = p[0], y = p[1]; for(let i = 0; i < k; i++){ const nx = 100 - y, ny = x; x = nx; y = ny; } return [x, y]; }
function rotZone(z, k){
  if(z.fn || !k) return z;
  if(z.c) return {c:rot(z.c, k), r:z.r};
  const a = rot([z.rect[0], z.rect[1]], k), b = rot([z.rect[2], z.rect[3]], k);
  return {rect:[Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[0], b[0]), Math.max(a[1], b[1])]};
}
function rotOverlay(o, k){
  if(!k) return o;
  const n = Object.assign({}, o);
  if(o.x != null){ const p = rot([o.x, o.y], k); n.x = p[0]; n.y = p[1]; }
  if(o.x2 != null){ const p = rot([o.x2, o.y2], k); n.x2 = p[0]; n.y2 = p[1]; }
  if(o.f != null) n.f = (o.f + 90 * k) % 360;
  return n;
}
function inZone(p, z){
  if(z.fn) return z.fn(p);
  if(z.c){ const dx = p[0] - z.c[0], dy = p[1] - z.c[1]; return Math.sqrt(dx * dx + dy * dy) <= z.r; }
  return p[0] >= z.rect[0] && p[0] <= z.rect[2] && p[1] >= z.rect[1] && p[1] <= z.rect[3];
}
function zoneCenter(z){ return z.fn ? z.label : z.c ? z.c : [(z.rect[0] + z.rect[2]) / 2, (z.rect[1] + z.rect[3]) / 2]; }
const f1 = n => Math.round(n * 100) / 100;

/* vector helpers for drills built from the boss's path (degrees clockwise from north, y grows south) */
const DEG = Math.PI / 180;
const unit = v => { const l = Math.hypot(v[0], v[1]) || 1; return [v[0] / l, v[1] / l]; };
const vadd = (a, b, k) => [a[0] + b[0] * (k == null ? 1 : k), a[1] + b[1] * (k == null ? 1 : k)];
const leftOf = d => [d[1], -d[0]];
const angOf = d => (Math.atan2(d[0], -d[1]) / DEG + 360) % 360;
const inArena = p => p[0] >= 0 && p[0] <= 100 && p[1] >= 0 && p[1] <= 100;
const COMPASS = ["north","northeast","east","southeast","south","southwest","west","northwest"];

/* Assault Evolved: three weapons, boss starts in the middle facing the first, then clockwise.
   He faces the way he jumped, so relative north at each weapon = his travel direction. */
function buildAssault(s){
  const spots = [0,45,90,135,180,225,270,315];
  let pick = [0,135,225];
  for(let t = 0; t < 60; t++){
    const cand = shuffle(spots.slice()).slice(0, 3);
    if(cand.every((a, i) => cand.every((b, j) => i === j || Math.min((a - b + 360) % 360, (b - a + 360) % 360) >= 90))){ pick = cand; break; }
  }
  const a0 = pick[0];
  const order = [a0].concat(pick.slice(1).sort((x, y) => ((x - a0 + 360) % 360) - ((y - a0 + 360) % 360)));
  const types = shuffle(["axe","sword","scythe"]);
  const W = order.map((a, i) => ({a, p:[50 + 29 * Math.sin(a * DEG), 50 - 29 * Math.cos(a * DEG)], type:types[i]}));
  const states = [{x:50, y:50, f:a0}];
  let prev = [50, 50];
  W.forEach(w => { const d = unit([w.p[0] - prev[0], w.p[1] - prev[1]]); states.push({x:w.p[0], y:w.p[1], f:angOf(d), d}); prev = w.p; });
  /* The scythe lies with its butt on his left and its blade end on his right as he lands,
     so H1 (butt) and H2 (point) can read their spot from the weapon itself. */
  const overlays = [];
  W.forEach((w, i) => {
    if(w.type === "scythe"){
      const d = states[i + 1].d;
      overlays.push({t:"scythe", x:w.p[0], y:w.p[1], ux:-d[1], uy:d[0], dx:d[0], dy:d[1]}, {t:"tag", x:w.p[0] - d[0] * 9, y:w.p[1] - d[1] * 9, s:"SCYTHE"});
    } else {
      const out = vadd(w.p, unit([w.p[0] - 50, w.p[1] - 50]), 7.5);
      overlays.push({t:"tag", x:out[0], y:out[1], s:w.type.toUpperCase()}, {t:"target", x:w.p[0], y:w.p[1]});
    }
  });
  const HW = 7, side = S(s, 1, -1), own = S(s, "left", "right");
  const steps = W.map((w, i) => {
    const st = states[i + 1], P = [st.x, st.y], d = st.d, L = leftOf(d), sv = [L[0] * side, L[1] * side];
    const where = COMPASS[Math.round(w.a / 45) % 8];
    let z, a, reveal;
    if(w.type === "axe"){
      z = {c:vadd(P, unit([50 - P[0], 50 - P[1]]), 28), r:7};
      a = "Axe, " + where + ": stack with the whole party in the middle, outside the axe AoE.";
      reveal = [{t:"aoe", x:P[0], y:P[1], r:20}];
    } else if(w.type === "scythe"){
      z = {c:vadd(P, sv, 9.5), r:5};
      a = "Scythe, " + where + ": close in at the " + S(s, "butt (the handle end)", "point (the blade end)") + " of the scythe.";
      reveal = [{t:"donut", x:P[0], y:P[1], r1:13, r2:75}];
    } else {
      const fn = p => { const v = [p[0] - P[0], p[1] - P[1]], f = v[0] * d[0] + v[1] * d[1], sd = v[0] * sv[0] + v[1] * sv[1]; return inArena(p) && f < -HW && sd > HW && Math.hypot(v[0], v[1]) <= 40; };
      const corner = vadd(vadd(P, d, -HW), sv, HW);
      const poly = [corner, vadd(corner, d, -32), vadd(vadd(corner, d, -32), sv, 32), vadd(corner, sv, 32)];
      z = {fn, show:[{poly}], label:vadd(P, unit(vadd([-d[0], -d[1]], sv)), 17)};
      a = "Sword, " + where + ": the pocket behind him on his " + own + ", on the side he jumped from. " + S(s, "G1", "G2") + " stacks on you.";
      reveal = [{t:"band", x:P[0] - d[0] * 150, y:P[1] - d[1] * 150, x2:P[0] + d[0] * 150, y2:P[1] + d[1] * 150, w:HW * 2},
                {t:"band", x:P[0] - L[0] * 150, y:P[1] - L[1] * 150, x2:P[0] + L[0] * 150, y2:P[1] + L[1] * 150, w:HW * 2}];
    }
    return {q:["First","Second","Third"][i] + " weapon: click where you go.", z, a, reveal};
  });
  return {W, states, steps, overlays};
}

/* Void Stardust: each puddle goes just outside the previous one, one small step clockwise.
   The next spot is judged from where the last puddle actually dropped. */
const PUDDLE_R = 6.5;
function nextPuddle(results){
  const q = results[results.length - 1].drop, rq = Math.max(8, Math.hypot(q[0] - 50, q[1] - 50));
  const step = 2 * Math.asin(Math.min(1, (PUDDLE_R + 2.5) / (2 * rq))) / DEG, ia = (angOf([q[0] - 50, q[1] - 50]) + step) * DEG;
  const ideal = [50 + rq * Math.sin(ia), 50 - rq * Math.cos(ia)];
  const fn = p => {
    const dq = Math.hypot(p[0] - q[0], p[1] - q[1]), r = Math.hypot(p[0] - 50, p[1] - 50);
    const cw = (angOf([p[0] - 50, p[1] - 50]) - angOf([q[0] - 50, q[1] - 50]) + 360) % 360;
    return inArena(p) && dq >= PUDDLE_R && dq <= PUDDLE_R + 6 && r >= 6 && r <= 32 && cw > 3 && cw < 110;
  };
  return {fn, label:ideal, show:[{c:ideal, r:4.5}]};
}

/* Orbital Omen, simplified to 4 lanes each way. Each set fires one north lane and one east lane.
   Set 2 always crosses in one of the four middle squares. */
function buildOrbital(){
  const outer = shuffle([0,3]), inner = shuffle([1,2]);
  const V = [outer[0], inner[0]].concat(shuffle([outer[1], inner[1]]));
  const H = shuffle([1,2]).concat(shuffle([0,3]));
  const lane = (n, vert) => vert ? {rect:[n * 25, 0, n * 25 + 25, 100]} : {rect:[0, n * 25, 100, n * 25 + 25]};
  const inV = (p, n) => p[0] >= n * 25 && p[0] <= n * 25 + 25, inH = (p, n) => p[1] >= n * 25 && p[1] <= n * 25 + 25;
  /* Hector's dodge: stay in the four middle squares against the boss hitbox and cross it
     to whichever middle square the next lines miss. */
  const mid = p => p[0] >= 25 && p[0] <= 75 && p[1] >= 25 && p[1] <= 75;
  const side = p => Math.abs(p[0] - 50) > Math.abs(p[1] - 50);
  const misses = (p, sets) => sets.every(i => !inV(p, V[i]) && !inH(p, H[i]));
  const cellRect = (c, r) => ({rect:[c * 25, r * 25, c * 25 + 25, r * 25 + 25]});
  const spot = (c, r) => [c === 1 ? 38 : 62, r === 1 ? 44 : 56];
  const c2 = V[1], r2 = H[1], cOpp = 3 - V[1], r1 = H[0];
  const overlays = [];
  V.forEach((n, i) => overlays.push({t:"guide", x:n * 25 + 12.5, y:0, x2:n * 25 + 12.5, y2:100}, {t:"portal", x:n * 25 + 12.5, y:2.6, vert:true, n:i + 1}));
  H.forEach((n, i) => overlays.push({t:"guide", x:0, y:n * 25 + 12.5, x2:100, y2:n * 25 + 12.5}, {t:"portal", x:97.4, y:n * 25 + 12.5, vert:false, n:i + 1}));
  const lanes = sets => sets.map(i => ({t:"lane", rect:lane(V[i], true).rect})).concat(sets.map(i => ({t:"lane", rect:lane(H[i], false).rect})));
  return {
    overlays,
    steps:[
      {q:"Before the #1 lines and Fire and Fury: where do you stand?",
        z:{fn:p => mid(p) && side(p) && misses(p, [0]), label:spot(c2, r2), show:[cellRect(1, r2), cellRect(2, r2)]},
        a:"Against the boss hitbox at his side, in a middle square the #1 lines miss. Best start: the square where the #2 lines cross.",
        reveal:[{t:"poly", pts:[[50,50],[0,0],[100,0]]}, {t:"poly", pts:[[50,50],[0,100],[100,100]]}].concat(lanes([0]))},
      {q:"The #1 lines and Fire and Fury went off. The #2 lines are next. Where do you go?",
        z:{fn:p => mid(p) && misses(p, [1]), label:spot(cOpp, r1), show:[cellRect(cOpp, r1)]},
        a:"Across the boss hitbox to the opposite middle square. The #2 lines miss it.",
        reveal:lanes([1])},
      {q:"The #2 lines went off. Where do you go now?",
        z:{fn:p => mid(p) && misses(p, [2, 3]), label:spot(c2, r2), show:[{rect:[c2 * 25, 25, c2 * 25 + 25, 75]}]},
        a:"Back across the hitbox, into the column the #2 line already hit. The #3 and #4 lines miss it, so you stay there.",
        reveal:lanes([2, 3]).map(o => Object.assign(o, {soft:true}))}
    ]
  };
}

function circlePath(cx, cy, r){ return "M" + f1(cx - r) + "," + f1(cy) + " a" + r + "," + r + " 0 1,0 " + (2 * r) + ",0 a" + r + "," + r + " 0 1,0 " + (-2 * r) + ",0"; }
function drawOverlay(o){
  const x = f1(o.x), y = f1(o.y);
  switch(o.t){
    case "aoe": return '<circle class="aoe" cx="' + x + '" cy="' + y + '" r="' + o.r + '"/>';
    case "donut": return '<path class="aoe" fill-rule="evenodd" d="' + circlePath(o.x, o.y, o.r2) + " " + circlePath(o.x, o.y, o.r1) + '"/>';
    case "lineaoe": return '<line class="lineaoe" x1="' + x + '" y1="' + y + '" x2="' + f1(o.x2) + '" y2="' + f1(o.y2) + '" stroke-width="' + (o.w || 1.3) + '"/>';
    case "tornado": return '<g class="tornado" transform="translate(' + x + " " + y + ')"><circle r="5.5"/><path d="M-3.4,-2.6 h6.8 M-2.7,-0.9 h5.4 M-2,0.8 h4 M-1.3,2.5 h2.6"/></g>';
    case "rock": return '<path class="rock" transform="translate(' + x + " " + y + ')" d="M-3,1 L-2.2,-2 L0.8,-3 L3,-1.2 L2.6,2 L-0.6,3 Z"/>';
    case "tower": return '<g class="tower" transform="translate(' + x + " " + y + ')"><circle class="out" r="6"/><circle class="in" r="1.1"/></g>';
    case "target": return '<circle class="target" cx="' + x + '" cy="' + y + '" r="4.2"/>';
    case "puddle": return '<circle class="puddle" cx="' + x + '" cy="' + y + '" r="' + o.r + '"/>';
    case "tag": { const w = o.s.length * 1.75 + 2.4; return '<g class="tag"><rect x="' + f1(o.x - w / 2) + '" y="' + f1(o.y - 1.9) + '" width="' + f1(w) + '" height="3.8" rx=".8"/><text x="' + x + '" y="' + y + '">' + esc(o.s) + "</text></g>"; }
    case "mark": return '<g class="mk ' + o.r + '"><rect x="' + f1(o.x - 2.4) + '" y="' + f1(o.y - 2.4) + '" width="4.8" height="4.8" rx=".9"/><text x="' + x + '" y="' + y + '">' + esc(o.l) + "</text></g>";
    case "scythe": {
      const P = [o.x, o.y], u = [o.ux, o.uy], d = [o.dx, o.dy], pt = p => f1(p[0]) + "," + f1(p[1]);
      const B = vadd(P, u, -10), K = vadd(P, u, 8), C = vadd(vadd(K, d, 6), u, 1.5), T = vadd(vadd(K, d, 10), u, -3);
      const path = "M" + pt(B) + " L" + pt(K) + " Q" + pt(C) + " " + pt(T);
      return '<g class="scy"><path class="halo" d="' + path + '"/><path class="ink" d="' + path + '"/><circle class="butt" cx="' + f1(B[0]) + '" cy="' + f1(B[1]) + '" r="1.5"/></g>';
    }
    case "band": return '<line class="aoeband" x1="' + x + '" y1="' + y + '" x2="' + f1(o.x2) + '" y2="' + f1(o.y2) + '" stroke-width="' + o.w + '"/>';
    case "lane": return '<rect class="' + (o.soft ? "lanesoft" : "aoe") + '" x="' + o.rect[0] + '" y="' + o.rect[1] + '" width="' + (o.rect[2] - o.rect[0]) + '" height="' + (o.rect[3] - o.rect[1]) + '"/>';
    case "poly": return '<polygon class="aoe" points="' + o.pts.map(p => f1(p[0]) + "," + f1(p[1])).join(" ") + '"/>';
    case "guide": return '<line class="guide" x1="' + x + '" y1="' + y + '" x2="' + f1(o.x2) + '" y2="' + f1(o.y2) + '"/>';
    case "portal": return '<g class="portal" transform="translate(' + x + " " + y + ')"><ellipse rx="' + (o.vert ? 6 : 2.2) + '" ry="' + (o.vert ? 2.2 : 6) + '"/><text>' + o.n + "</text></g>";

  }
}
function drawBoss(b){
  return '<g transform="translate(' + f1(b.x) + " " + f1(b.y) + ')"><circle class="ring" r="11"/><circle class="bosscore" r="3.4"/>' +
    (b.f == null ? "" : '<path class="face" transform="rotate(' + b.f + ')" d="M0,-14.6 L-2.6,-10.4 L2.6,-10.4 Z"/>') + "</g>";
}
function drawWaymarks(){
  return WAYMARKS.map(w => '<g class="wm wm-' + w.c + '">' +
    (w.sq ? '<rect x="' + (w.x - 3) + '" y="' + (w.y - 3) + '" width="6" height="6" rx=".6"/>' : '<circle cx="' + w.x + '" cy="' + w.y + '" r="3.2"/>') +
    '<text x="' + w.x + '" y="' + (w.y + 0.2) + '">' + w.id + "</text></g>").join("");
}
function floorSVG(split){
  let h = '<defs><clipPath id="arenaClip"><rect x="0" y="0" width="100" height="100"/></clipPath>' +
    '<pattern id="tiles" width="12.5" height="12.5" patternUnits="userSpaceOnUse"><path class="tileline" d="M12.5 0H0V12.5"/></pattern></defs>' +
    '<rect class="floor" x="0" y="0" width="100" height="100"/><rect x="0" y="0" width="100" height="100" fill="url(#tiles)"/>';

}
function sceneSVG(c){
  const sc = c.scene, k = c.k;

  h += floorSVG(sc.split);
  h += '<text class="compass" x="50" y="-2.2">N</text>';
  h += '<g clip-path="url(#arenaClip)">' + sc.overlays.map(o => drawOverlay(rotOverlay(o, k))).filter(Boolean).join("") + "</g>";
  h += '<g id="reveal-layer" clip-path="url(#arenaClip)"></g>';

}
function zoneSVG(z, cls){
  if(z.fn) return (z.show || []).map(sh => zoneSVG(sh, sh.cls || cls)).join("");
  const c = "zone " + cls;
  if(z.poly) return '<polygon class="' + c + '" points="' + z.poly.map(p => f1(p[0]) + "," + f1(p[1])).join(" ") + '"/>';
  if(z.c) return '<circle class="' + c + '" cx="' + f1(z.c[0]) + '" cy="' + f1(z.c[1]) + '" r="' + z.r + '"/>';
  return '<rect class="' + c + '" x="' + f1(z.rect[0]) + '" y="' + f1(z.rect[1]) + '" width="' + f1(z.rect[2] - z.rect[0]) + '" height="' + f1(z.rect[3] - z.rect[1]) + '"/>';
}
function drawFeedback(){
  const c = state.cur, svg = document.getElementById("arena-svg");
  if(!svg) return;
  const sc = c.scene, n = c.results.length, showLast = c.waiting || n >= sc.steps.length;
  let drops = "", fb = "", rev = "";
  c.results.forEach((r, i) => {
    const step = sc.steps[i], z = r.z || rotZone(step.z, c.k), ctr = zoneCenter(z);
    if(r.drop) drops += '<circle class="drop" cx="' + f1(r.drop[0]) + '" cy="' + f1(r.drop[1]) + '" r="' + PUDDLE_R + '"/>';
    if(i === n - 1 && showLast){
      const cls = r.ok ? "ok" : "bad";
      if(step.reveal) rev = step.reveal.map(o => drawOverlay(rotOverlay(o, c.k))).join("");
      fb += '<g clip-path="url(#arenaClip)">' + zoneSVG(z, cls) + "</g>";
      const top = z.c ? z.c[1] - z.r : z.rect ? z.rect[1] : ctr[1] + 1, bottom = z.c ? z.c[1] + z.r : z.rect ? z.rect[3] : ctr[1] - 1;
      const ly = z.fn ? ctr[1] : (top - 3 >= -3 ? top - 3 : bottom + 3);
      fb += '<g class="zlabel"><rect x="' + f1(ctr[0] - 3.2) + '" y="' + f1(ly - 2.1) + '" width="6.4" height="4.2" rx=".9"/><text x="' + f1(ctr[0]) + '" y="' + f1(ly) + '">' + state.slot + "</text></g>";
      fb += '<g class="pick ' + cls + '" transform="translate(' + f1(r.p[0]) + " " + f1(r.p[1]) + ')"><circle class="halo" r="2.6"/><circle class="dot" r="1.1"/></g>';
    }
  });
  const boss = sc.bossAt ? sc.bossAt(n) : (sc.boss ? rotOverlay(sc.boss, c.k) : null);
  svg.querySelector("#reveal-layer").innerHTML = rev;
  svg.querySelector("#drops").innerHTML = drops;
  svg.querySelector("#boss-layer").innerHTML = boss ? drawBoss(boss) : "";

/* ---------- tab + header ---------- */
function renderTabs(){
  const nav = document.getElementById("tabs");
  nav.innerHTML = TABS.map(t => '<button type="button" role="tab" id="tab-' + t.id + '" data-tab="' + t.id + '" aria-selected="' + (t.id === state.tab) + '">' + esc(t.label) + "</button>").join("");

}
function scrollActiveTab(){
  const nav = document.getElementById("tabs"), act = nav && nav.querySelector('[aria-selected="true"]');
  if(!act) return;
  const l = act.getBoundingClientRect().left - nav.getBoundingClientRect().left + nav.scrollLeft, r = l + act.offsetWidth;
  if(l < nav.scrollLeft || r > nav.scrollLeft + nav.clientWidth) nav.scrollLeft = Math.max(0, l - 12);
}
function setSlot(s){
  state.slot = s; LS.set("slot", s);

  state.decks = {};

}
function stopTimer(){

}
function go(tab){
  if(!TABS.some(t => t.id === tab)) tab = "map";
  stopTimer();
  state.tab = tab; state.pressure = null;
  renderTabs();
  if(location.hash !== "#" + tab){ try{ history.replaceState(null, "", "#" + tab); }catch(e){} }
  render();
}
function tabHead(withOrder){
  const t = TABS.find(x => x.id === state.tab);

    h += '<div class="ctrl"><span id="job-lbl">Job</span><div class="seg small" role="group" aria-labelledby="job-lbl">' +
      Object.keys(JOBS).map(j => '<button type="button" id="job-' + j + '" data-job="' + j + '" aria-pressed="' + (state.job === j) + '">' + JOBS[j] + "</button>").join("") + "</div></div>";

      '<button type="button" id="order-weak" data-order="weak" aria-pressed="' + (state.order === "weak") + '">Weak spots first</button></div></div>';

}
function render(){
  stopTimer();
  if(state.tab === "map") return renderMap();

/* ---------- map drill view ---------- */
function renderMap(fresh){
  const d = getDeck("map");
  if(d.i >= d.items.length) return renderRoundDone("map", d);
  const item = d.items[d.i];
  if(fresh !== false || !state.cur || state.cur.item !== item){
    const v = item.variants ? item.variants[Math.floor(Math.random() * item.variants.length)] : null;
    state.cur = {kind:"map", item, scene:item.build(state.slot, v), k:item.rotate ? Math.floor(Math.random() * 4) : 0, results:[], counted:false};
  }
  const c = state.cur;
  view.innerHTML = tabHead(true) +
    '<div class="stage"><div class="arena">' + sceneSVG(c) +
    '<div class="legend"><span><i style="background:var(--ring)"></i>Boss hitbox and facing</span><span><i style="background:var(--aoe)"></i>AoE</span><span><i style="background:var(--tank)"></i>Tank</span><span><i style="background:var(--dps)"></i>DPS</span></div></div>' +
    '<div class="panel" id="map-panel"></div></div>';
  document.getElementById("arena-svg").addEventListener("click", onArenaClick);
  drawFeedback();
  drawMapPanel();
}
function drawMapPanel(){
  const c = state.cur, d = getDeck("map"), sc = c.scene, done = c.results.length >= sc.steps.length;
  let h = '<div class="eyebrow"><b>' + esc(c.item.phase) + "</b><span>" + esc(c.item.time) + '</span><span class="progress">Drill ' + (d.i + 1) + " of " + d.items.length + "</span></div>";
  h += "<h2>" + esc(c.item.title) + "</h2><p class=\"setup\">" + esc(sc.setup) + "</p>";
  h += '<ol class="steps">' + sc.steps.map((st, i) => {
    const r = c.results[i];
    if(r) return '<li class="' + (r.ok ? "ok" : "bad") + '"><span class="tag">' + (r.ok ? "Right" : "Not there") + "</span>" + esc(st.q) + '<span class="ans">' + esc(st.a) + "</span></li>";
    if(i === c.results.length) return '<li class="now">' + (sc.steps.length > 1 ? "Step " + (i + 1) + ": " : "") + esc(st.q) + "</li>";
    return "<li>" + (sc.steps.length > 1 ? "Step " + (i + 1) + ": " : "") + "&hellip;</li>";
  }).join("") + "</ol>";
  if(done){
    h += '<div class="rule"><span>Rule</span><strong>' + esc(sc.rule) + "</strong></div>";
    h += '<div class="actions"><button type="button" class="btn" id="map-next">Next drill</button><button type="button" class="btn ghost" id="map-again">Try this one again</button><span class="hint"><kbd>Enter</kbd> next</span></div>';
  } else if(c.waiting){
    h += '<div class="actions"><button type="button" class="btn" id="map-step">Next step</button><span class="hint"><kbd>Enter</kbd> next step</span></div>';
  } else {
    h += '<p class="hint" style="margin-top:14px">Click the arena. The green area shows the right spot after you click.</p>';
  }
  const p = document.getElementById("map-panel");

  const ns = document.getElementById("map-step"); if(ns) ns.addEventListener("click", nextStep);
}
function onArenaClick(e){
  const c = state.cur; if(!c || c.kind !== "map") return;
  if(c.waiting || c.results.length >= c.scene.steps.length) return;
  const svg = e.currentTarget, pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  const ctm = svg.getScreenCTM(); if(!ctm) return;
  const q = pt.matrixTransform(ctm.inverse());
  const p = [q.x, q.y];
  const step = c.scene.steps[c.results.length];
  const zone = rotZone(step.zf ? step.zf(c.results) : step.z, c.k);
  const ok = inZone(p, zone);
  c.results.push({p, ok, z:zone, drop:step.drop ? (ok ? p : zoneCenter(zone)) : null});
  if(c.results.length < c.scene.steps.length) c.waiting = true;
  else if(!c.counted){ c.counted = true; const all = c.results.every(r => r.ok); record(c.item.id, all); const d = getDeck("map"); d.done++; if(all) d.right++; }
  drawFeedback(); drawMapPanel();
}
function nextStep(){ const c = state.cur; c.waiting = false; drawFeedback(); drawMapPanel(); }
function nextMap(){ const d = getDeck("map"); d.i++; renderMap(true); }

/* ---------- multiple-choice view ---------- */
function prepMCQ(item, cat){
  const q = item.build(state.slot);
  state.cur = {kind:"mcq", cat, item, q, opts:shuffle(q.options.map(o => Object.assign({}, o))), answered:false, pick:-1, slow:false};
}
function renderQuiz(cat){
  const d = getDeck(cat);
  if(d.i >= d.items.length) return renderRoundDone(cat, d);
  prepMCQ(d.items[d.i], cat);
  view.innerHTML = tabHead(true) + '<div class="qwrap"><div class="panel" id="q-panel"></div></div>';
  drawMCQ();
}
function drawMCQ(){
  const c = state.cur, item = c.item, q = c.q, p = document.getElementById("q-panel");
  let prog = "";
  if(c.cat === "pressure"){ const pr = state.pressure; prog = "Question " + (pr.i + 1) + " of " + pr.queue.length; }

  c.opts.forEach((o, i) => {
    let cls = "opt";

  });

    const ok = c.pick >= 0 && c.opts[c.pick].ok;

    h += '<div class="fb ' + cls + '" role="status"><h3>' + head + "</h3>";
    if(c.slow) h += "<p>In the fight, this is the moment you would stand still. Any action beats freezing.</p>";
    h += "<p>" + esc(q.why) + "</p></div>";
    h += '<div class="rule"><span>Rule</span><strong>' + esc(q.rule) + "</strong></div>";
    if(q.src) h += '<p class="src">Source: ' + esc(q.src) + "</p>";
    h += '<div class="actions"><button type="button" class="btn" id="q-next">Next</button><span class="hint"><kbd>Enter</kbd> next</span></div>';
  } else {
    h += '<p class="hint" style="margin-top:12px">Press <kbd>1</kbd> to <kbd>' + c.opts.length + "</kbd> or click an answer.</p>";
  }
  p.innerHTML = h;
  p.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => answer(Number(b.dataset.i))));
  const nx = document.getElementById("q-next"); if(nx){ nx.addEventListener("click", nextQ); nx.focus({preventScroll:true}); }
}
function answer(i){
  const c = state.cur; if(!c || c.kind !== "mcq" || c.answered) return;
  stopTimer();
  c.answered = true; c.pick = i;
  const ok = c.opts[i].ok === true;
  record(c.item.id, ok);
  if(c.cat === "pressure"){ if(ok) state.pressure.right++; else state.pressure.wrong++; }
  else { const d = getDeck(c.cat); d.done++; if(ok) d.right++; }
  drawMCQ();
}
function nextQ(){
  const c = state.cur;
  if(c.cat === "pressure"){ state.pressure.i++; return showPressureQ(); }
  getDeck(c.cat).i++; renderQuiz(c.cat);
}
function renderRoundDone(cat, d){
  const pct = d.done ? Math.round(100 * d.right / d.done) : 0;
  view.innerHTML = tabHead(true) + '<div class="qwrap"><div class="panel"><div class="eyebrow"><b>Round done</b></div><h2>' + d.right + " of " + d.done + " right (" + pct + "%)</h2>" +
    "<p>Missed items come back more often when you pick <strong>Weak spots first</strong>. Your progress stays in this browser.</p>" +
    '<div class="actions"><button type="button" class="btn" id="again">Go again</button></div></div></div>';
  document.getElementById("again").addEventListener("click", () => { delete state.decks[cat]; render(); });
}

/* ---------- pressure round ---------- */
function renderPressureStart(){
  let h = tabHead(false) + '<div class="qwrap"><div class="panel"><div class="eyebrow"><b>Pressure round</b><span>12 questions</span></div>' +
    "<h2>Practice deciding fast</h2><p>Each question has a short timer. When it runs out, the round counts a freeze and shows you the answer. Aim for zero freezes first. Correct answers come with practice.</p>" +
    '<div class="ctrl" style="margin-top:14px"><span id="secs-lbl">Seconds per question</span><div class="seg small" role="group" aria-labelledby="secs-lbl">' +
    [4,6,8,10].map(n => '<button type="button" id="secs-' + n + '" data-secs="' + n + '" aria-pressed="' + (state.psecs === n) + '">' + n + "</button>").join("") +
    '</div></div><div class="actions"><button type="button" class="btn" id="p-start">Start</button><span class="hint"><kbd>Enter</kbd> start</span></div></div></div>';
  view.innerHTML = h;
  state.cur = {kind:"pstart"};
  view.querySelectorAll("[data-secs]").forEach(b => b.addEventListener("click", () => { state.psecs = Number(b.dataset.secs); LS.set("psecs", state.psecs); renderPressureStart(); }));
  document.getElementById("p-start").addEventListener("click", startPressure);
}
function startPressure(){
  const pool = [...MECH, ...DEATH, ...NEXT_ITEMS, ...POOLS.job()];
  state.pressure = {queue:weighted(pool).slice(0, 12), i:0, right:0, wrong:0, froze:0};
  showPressureQ();
}
function showPressureQ(){
  const pr = state.pressure;
  if(pr.i >= pr.queue.length) return renderPressureDone();
  prepMCQ(pr.queue[pr.i], "pressure");
  view.innerHTML = tabHead(false) + '<div class="qwrap"><div class="panel" id="q-panel"></div></div>';
  drawMCQ();
  startTimer();
}
function startTimer(){
  stopTimer();
  const ms = state.psecs * 1000, t0 = performance.now();
  state.tout = setTimeout(() => { state.tout = 0; timeout(); }, ms);
  const tick = now => {
    const el = document.getElementById("timer");
    if(!el || state.cur.answered){ state.raf = 0; return; }
    const left = Math.max(0, 1 - (now - t0) / ms);
    el.firstChild.style.width = (left * 100).toFixed(1) + "%";
    el.classList.toggle("low", left < 0.34);
    state.raf = left > 0 ? requestAnimationFrame(tick) : 0;
  };
  state.raf = requestAnimationFrame(tick);
}
function timeout(){
  const c = state.cur; if(!c || c.kind !== "mcq" || c.cat !== "pressure" || c.answered) return;
  stopTimer();
  c.answered = true; c.slow = true; c.pick = -1;
  state.pressure.froze++;
  record(c.item.id, false);
  drawMCQ();
}
function renderPressureDone(){
  const pr = state.pressure;
  const msg = pr.froze === 0 ? "No freezes. You made a choice every time, which is the habit you want in the fight." :
    "Each freeze is a moment you would stand still in the fight. Run it again and aim for zero freezes, even if some answers are wrong.";
  view.innerHTML = tabHead(false) + '<div class="qwrap"><div class="panel"><div class="eyebrow"><b>Round done</b></div><h2>' + pr.right + " of " + pr.queue.length + " right</h2>" +
    '<div class="tally"><div class="ok"><span>Right</span><div class="big">' + pr.right + '</div></div><div class="bad"><span>Wrong</span><div class="big">' + pr.wrong + '</div></div><div class="slow"><span>Froze</span><div class="big">' + pr.froze + "</div></div></div>" +
    "<p>" + msg + '</p><div class="actions"><button type="button" class="btn" id="p-again">Run it again</button><button type="button" class="btn ghost" id="p-speed">Change speed</button></div></div></div>';
  state.cur = {kind:"pdone"};
  document.getElementById("p-again").addEventListener("click", startPressure);
  document.getElementById("p-speed").addEventListener("click", renderPressureStart);
}

/* ---------- cheat sheet ---------- */
function swordDiagram(s){
  const P = [21, 50], d = [-1, 0], L = leftOf(d), HW = 7, mine = S(s, 1, -1);
  const pocket = side => { const sv = [L[0] * side, L[1] * side], corner = vadd(vadd(P, d, -HW), sv, HW); return [corner, vadd(corner, d, -32), vadd(vadd(corner, d, -32), sv, 32), vadd(corner, sv, 32)]; };
  const poly = (pts, cls) => '<polygon class="zone ' + cls + '" points="' + pts.map(p => f1(p[0]) + "," + f1(p[1])).join(" ") + '"/>';
  const label = (side, txt) => { const p = vadd(P, unit(vadd([-d[0], -d[1]], [L[0] * side, L[1] * side])), 17);
    return '<g class="zlabel' + (side === mine ? "" : " other") + '"><rect x="' + f1(p[0] - 8) + '" y="' + f1(p[1] - 2.3) + '" width="16" height="4.6" rx=".9"/><text x="' + f1(p[0]) + '" y="' + f1(p[1]) + '">' + txt + "</text></g>"; };
  let h = '<svg viewBox="-4 -6 108 110" role="img" aria-label="Sword example. The boss jumps west from the middle. G1 takes the pocket behind his left side, G2 the pocket behind his right side.">';
  h += floorSVG(false) + '<text class="compass" x="50" y="-2.2">N</text>';
  h += '<g clip-path="url(#arenaClip)">' + drawOverlay({t:"band", x:171, y:50, x2:-129, y2:50, w:HW * 2}) + drawOverlay({t:"band", x:21, y:-100, x2:21, y2:200, w:HW * 2}) +
    poly(pocket(1), mine === 1 ? "ok" : "other") + poly(pocket(-1), mine === -1 ? "ok" : "other") + "</g>";
  h += '<circle class="ghost" cx="50" cy="50" r="3.4"/><line class="jump" x1="46" y1="50" x2="33" y2="50"/>';
  h += drawWaymarks() + drawBoss({x:P[0], y:P[1], f:270}) + label(1, "G1 / H1") + label(-1, "G2 / H2");
  return h + "</svg>";
}
function renderSheet(){
  const s = state.slot;
  const rows = TL.map(e => '<tr><td class="t">' + e.t + '</td><td class="n">' + esc(e.n) + '<br><span class="chip k-' + e.k + '">' + KIND[e.k] + "</span></td><td>" + esc(e.job(s)) + "</td></tr>").join("");
  const seen = Object.keys(state.stats).length;
  view.innerHTML = tabHead(false) + '<div class="sheet">' +
    '<div class="cols"><section><h2>Someone died</h2><ol>' +
    "<li>Are you about to die? Heal yourself first.</li>" +
    "<li>Did Andrew call “let's get them up”? Raise now and say “I got it.”</li>" +
    "<li>Did someone else say “I got it”? Do not raise. Heal the party.</li>" +
    "<li>Did a raidwide just land, with more damage soon? Heal the party first, then raise.</li>" +
    "<li>Is a scythe or a bait about to resolve? Raise right after it.</li>" +
    "<li>Otherwise, raise now with Swiftcast. 5 to 8 seconds is the limit.</li></ol>" +
    "<p>In the nados (Ultimate Trophy Weapons), the dead player must be up by the 3rd weapon. They stand up where you are, so raise from a safe spot.</p></section>" +
    "<section><h2>Panic reset</h2><ol>" +
    "<li>Feet: go to your spot for the next mechanic.</li>" +
    "<li>Self: if you are low, heal or shield yourself.</li>" +
    "<li>Team: a hit soon? Heal the party. Quiet? Raise, and say “I got it.”</li></ol>" +
    "<p>Say it in your head: feet, self, team. If you are not sure, any of these beats standing still.</p></section></div>" +
    '<section><h2>Positions to remember</h2><div class="cols"><div><ul class="rules">' +
    "<li><b>Weapon order:</b> the first weapon is the one he faces. Then he goes clockwise.</li>" +
    "<li><b>Sword:</b> the cross lines up with the way he jumped. Stand in the pocket behind him, on the side he jumped from: G1 on his left, G2 on his right. As " + s + ", you take the " + S(s, "left", "right") + " pocket, and your light party stacks on you.</li>" +
    "<li><b>Scythe:</b> H1 at the butt, H2 at the point, close in.</li>" +
    "<li><b>Axe:</b> the whole party stacks in the middle, out of the axe AoE.</li>" +
    "<li><b>Void Stardust:</b> start north of the boss. Drop each puddle just outside the last one, a small step clockwise. Then stack or spread.</li>" +
    "<li><b>Orbital Omen (Hector's dodge):</b> stay against the boss hitbox, at his side. Start where the #2 lines cross. After #1 and Fire and Fury, cross the hitbox to the opposite middle square. After #2, cross back and stay.</li>" +
    "<li><b>Meteorain, melee (1st set):</b> the melee step in close to the boss to take the first markers. M1 drops NE and M2 drops SW, both inside the boss hitbox. Everyone else stacks NW for the first line stack, with the tanks in front.</li>" +
    "<li><b>Meteorain, your meteor:</b> " + S(s, "drop it NW, inside the boss hitbox.", "drop it SW, in line with the first SW rock, farther out.") + "</li>" +
    "<li><b>Meteorain, ranged (3rd set):</b> the ranged step in close to the boss to take the markers. R1 drops SW near the edge, at the end of the SW line, and leaves room behind it to hide. R2 drops NE, inside the boss hitbox.</li>" +
    '</ul></div><figure class="mini">' + swordDiagram(s) +
    "<figcaption>Example: he jumps west from the middle. The pockets on the side he came from are the two stack spots. Yours is green.</figcaption></figure></div></section>" +
    "<section><h2>Your timeline as " + s + '</h2><div class="tablebox"><table><thead><tr><th>Time</th><th>Mechanic</th><th>Your job</th></tr></thead><tbody>' + rows + "</tbody></table></div>" +
    '<p class="hint">Times are from the cactbot fight timeline. Some phase 1 times move by a second or two with the axe or scythe opener.</p></section>' +
    "<section><h2>Suggested " + JOBS[state.job] + ' plan</h2><div class="tablebox"><table><thead><tr><th>Time</th><th>When</th><th>Press</th></tr></thead><tbody>' +
    POOLS.job().slice().sort((a, b) => a.order - b.order).map(it => { const q = it.build(s), right = q.options.find(o => o.ok); return '<tr><td class="t">' + esc(it.time) + '</td><td class="n">' + esc(q.rule) + "</td><td>" + esc(right.t) + "</td></tr>"; }).join("") +
    '</tbody></table></div><p class="hint">Switch jobs on the My job tab. This plan uses only your own buttons. Agree with your co-healer who covers each raidwide.</p></section>' +
    '<section><h2>Sources</h2><ul class="links">' +
    '<li><a href="https://wtfdig.info/74/m11s#hector:nobuddies:fixed" target="_blank" rel="noopener">wtfdig M11S</a> <span>Your strats: Hector (Toxic), Kindred No Buddies, Fixed (3CJ)</span></li>' +
    '<li><a href="https://www.youtube.com/watch?v=w1uuwzhyf5A" target="_blank" rel="noopener">Hector\'s video guide</a></li>' +
    '<li><a href="https://raidplan.io/plan/HJAbE7fuWodELUSB" target="_blank" rel="noopener">Toxic Friends raidplan</a> <span>Phases 1 and 2</span></li>' +
    '<li><a href="https://raidplan.io/plan/hvbysrfwvrc55ahz" target="_blank" rel="noopener">Kindred raidplan</a> <span>Arena Split</span></li>' +
    '<li><a href="https://raidplan.io/plan/KXVlSGwV3zqON3CJ" target="_blank" rel="noopener">Fixed Stampede raidplan</a> <span>Ecliptic Stampede</span></li>' +
    '<li><a href="https://www.icy-veins.com/ffxiv/aac-heavyweight-m3-savage-raid-guide" target="_blank" rel="noopener">Icy Veins M11S guide</a> <span>Mechanic details, enrage at 11:00</span></li>' +
    '<li><a href="https://github.com/OverlayPlugin/cactbot/blob/main/ui/raidboss/data/07-dt/raid/r11s.txt" target="_blank" rel="noopener">cactbot r11s timeline</a> <span>Times</span></li>' +
    '<li><a href="https://ffxiv.consolegameswiki.com/wiki/Resurrect" target="_blank" rel="noopener">consolegameswiki: Resurrect</a> <span>Raised players appear at the caster</span></li></ul></section>' +
    "<section><h2>Your progress</h2><p>You answered " + seen + " different items so far. Progress stays in this browser only.</p>" +
    '<div class="actions"><button type="button" class="btn ghost" id="reset">' + (state.confirmReset ? "Click again to erase progress" : "Reset my progress") + "</button></div></section></div>";
  state.cur = {kind:"sheet"};
  document.getElementById("reset").addEventListener("click", () => {
    if(!state.confirmReset){ state.confirmReset = true; return renderSheet(); }
    state.confirmReset = false; state.stats = {}; LS.del("stats"); state.decks = {}; renderSheet();
  });
}

/* ---------- events ---------- */
document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if(b) go(b.dataset.tab); });
document.querySelectorAll(".seg button[data-slot]").forEach(b => b.addEventListener("click", () => setSlot(b.dataset.slot)));
view.addEventListener("click", e => {
  const j = e.target.closest("[data-job]");
  if(j){ state.job = j.dataset.job; LS.set("job", state.job); delete state.decks.job; return render(); }
  const b = e.target.closest("[data-order]"); if(!b) return;
  state.order = b.dataset.order; LS.set("order", state.order); state.decks = {}; render();
});
document.addEventListener("keydown", e => {
  if(e.altKey || e.ctrlKey || e.metaKey) return;
  const c = state.cur; if(!c) return;
  const tag = (e.target && e.target.tagName) || "";
  if(c.kind === "mcq"){
    if(!c.answered && /^[1-9]$/.test(e.key)){ const i = Number(e.key) - 1; if(i < c.opts.length){ e.preventDefault(); answer(i); } }
    else if(c.answered && (e.key === "Enter" || e.key === " ") && tag !== "BUTTON"){ e.preventDefault(); nextQ(); }
  } else if(c.kind === "map" && e.key === "Enter" && tag !== "BUTTON"){
    if(c.waiting){ e.preventDefault(); nextStep(); }
    else if(c.results.length >= c.scene.steps.length){ e.preventDefault(); nextMap(); }
  } else if(c.kind === "pstart" && e.key === "Enter" && tag !== "BUTTON"){ e.preventDefault(); startPressure(); }
});
window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if(t && t !== state.tab) go(t); });

function start(data){
  document.querySelectorAll(".seg button[data-slot]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.slot === state.slot)));
  const fromHash = location.hash.slice(1);
  go((data && data.tab) || fromHash || "map");
  try{ if(document.fonts && document.fonts.ready) document.fonts.ready.then(scrollActiveTab); }catch(e){}
  try{ if(window.claude && window.claude.hot && window.claude.hot.snapshot){ window.claude.hot.snapshot(() => ({tab:state.tab})); } }catch(e){}
}
if(window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
