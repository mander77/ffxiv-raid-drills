<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The fight's names, as in FIGHT_INFO (src/data/fightInfo.ts). Change both together. -->
<meta name="description" content="Practice drills for Final Fantasy XIV raids. Current fight: M11S (The Tyrant, Savage) for healers: learn the mechanics and your positions, then practice them under time pressure.">
<meta name="robots" content="noindex">
<title>FFXIV Raid Drills &middot; M11S</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!-- Light or dark mode before the page draws, so it never flashes light. ThemeProvider
     keeps the choice under the same name; "system" follows the computer. -->
<script>
  try {
    var mode = localStorage.getItem("raid-drills-theme") || "system";
    if (mode === "system") mode = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.classList.add(mode);
  } catch (e) {}
</script>
<script type="module" src="/src/main.tsx"></script>
</head>
<body>
<!-- React draws the whole site into #root (src/main.tsx). -->
<div id="root"></div>
</body>
</html>
