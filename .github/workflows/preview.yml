# A Cloudflare preview of a branch, at <branch>.test.ffxiv-raid-drills.app.
# It runs only when a push changes the app: GitHub's path filter skips the workflow when every
# changed file is in the list below. The list must match the exclude paths of Cloudflare's build
# watch paths for main (docs/decisions.md, "Hosting").
# The job waits for the owner's approval (the "preview" environment holds the token). It does
# not wait for CI: check that CI passed before you approve.
name: Preview

on:
  push:
    # main deploys through Cloudflare's own build. Dependabot's branches get no preview.
    branches: ["**", "!main", "!dependabot/**"]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/**"
      - ".claude/**"
      - "skills-lock.json"
      - "test/**"
      - "e2e/**"
      - "scripts/**"
      - "playwright.config.ts"
      - "biome.json"
      - "mise.toml"
      - "components.json"
      - ".gitignore"
      - ".gitattributes"
      - ".nojekyll"

permissions:
  contents: read

# A new push to the same branch cancels a preview that is still waiting or running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.ref_name }}
        # The preview's name is the branch name with "/" and other signs as "-" (chore/ci becomes
        # chore-ci), as Cloudflare's own builds named it.
        run: |
          name=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g')
          npx wrangler preview --name "$name" --message "$GITHUB_SHA"
          echo "url=https://$name.test.ffxiv-raid-drills.app/" >> "$GITHUB_OUTPUT"
