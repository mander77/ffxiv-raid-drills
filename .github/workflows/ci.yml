# The checks: lint, type check, unit tests, build and browser tests.
# They run on every push to any branch, so a branch has its result before it goes on main,
# and on pull requests to main. main accepts a commit only after both jobs passed on it.
# Cloudflare builds and deploys main on its own. For any other branch whose push changed the
# app, the preview job makes a Cloudflare preview once the checks pass and the owner approves.
name: CI

on:
  push:
    # Dependabot's branches run once, as pull requests.
    branches: ["**", "!dependabot/**"]
  pull_request:
    branches: [main]

# Read the code, nothing else.
permissions:
  contents: read

# A new push to the same branch or pull request cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit, with the version in a comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Chromium, Firefox and WebKit, with the system libraries they need.
      - run: npx playwright install --with-deps
      # The list for the log, and the HTML report to download when a test fails.
      - run: npm run e2e -- --reporter=list,html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  changes:
    name: App changed
    # Previews are for branches. main deploys through Cloudflare's own build.
    if: github.event_name == 'push' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, to compare with the last push or with main.
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        # Compare with the commit before this push. A new branch, or one that was force-pushed,
        # has no usable commit before, so compare with where it left main.
        run: |
          if git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null; then
            from=$BEFORE
          else
            from=$(git merge-base origin/main HEAD)
          fi
          echo "app=$(sh scripts/app-changed.sh "$from" HEAD)" >> "$GITHUB_OUTPUT"

  preview:
    name: Preview
    needs: [check, e2e, changes]
    # Only when the app changed, and only after the checks passed.
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment holds the Cloudflare token, and each run waits for the owner's approval.
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.ref_name }}
        # The preview's name is the branch name with "/" and other signs as "-" (chore/ci becomes
        # chore-ci), as Cloudflare's own builds named it. Its address is <name>.test.ffxiv-raid-drills.app.
        run: |
          name=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g')
          npx wrangler preview --name "$name" --message "$GITHUB_SHA"
          echo "url=https://$name.test.ffxiv-raid-drills.app/" >> "$GITHUB_OUTPUT"
